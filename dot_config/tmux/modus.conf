# ──────────────────────────────────────────────────────────────
# Modus vivendi (deuteranopia) — hand-authored static palette for tmux.
# Sourced last by tmux.conf, overrides all prior styling.
# Matches kitty/current-theme.conf.
# Palette: miikanissi/modus-themes.nvim (modus_vivendi / deuteranopia),
# background lowered to #121212.
# Accent pills use warning yellow #efef00 (L*92) — the highest-contrast
# colour in the palette (15.2:1) and unambiguous under any colour deficiency.
# Glassy: base surfaces transparent (bg=default) so kitty's
# background_blur shows through; only active accent pills opaque.
# ──────────────────────────────────────────────────────────────

# ── Status bar ──────────────────────────────────────────────
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#ffffff"

# ── Left: session name, with a prefix-active indicator ──────
set -g status-left-length 60
set -g status-left "#[fg=#121212,bg=#efef00,bold] #S #[fg=#efef00,bg=default]#{?client_prefix,#[fg=#00d3d0] ● ,} "

# ── Windows: subtle when inactive, accented when focused ────
set -g window-status-separator ""
set -g window-status-format "#[fg=#989898,bg=default]  #I:#W  "
set -g window-status-current-format "#[fg=#121212,bg=#efef00,bold]  #I:#W#{?window_zoomed_flag, 󰁌 ,}  "

# ── Right: current path + clock ─────────────────────────────
set -g status-right-length 120
set -g status-right "#[fg=#989898,bg=default] ? help #[fg=#ffffff] #{b:pane_current_path} #[fg=#121212,bg=#79a8ff] 󰥔 %H:%M #(sh ~/.config/tmux/notify-omp-waiting.sh)"

# ── Panes ───────────────────────────────────────────────────
set -g pane-border-style "fg=#646464"
set -g pane-active-border-style "fg=#efef00"

# ── Messages / copy-mode ────────────────────────────────────
# `fill` is REQUIRED on tmux 3.7+ (issue #4861): without it the command
# prompt overlays the status content instead of replacing it.
set -g message-style "bg=#3a3a4a,fg=#ffffff,fill=#3a3a4a"
set -g message-command-style "bg=#3a3a4a,fg=#efef00,fill=#3a3a4a"
set -g mode-style "bg=#3a3a4a,fg=#ffffff"

# ── Clock ───────────────────────────────────────────────────
setw -g clock-mode-colour "#efef00"

# ──────────────────────────────────────────────────────────────
# One Dark (warmer) — hand-authored static palette for tmux.
# Sourced last by tmux.conf, overrides all prior styling.
# Matches kitty/current-theme.conf.
# Palette: navarasu/onedark.nvim lua/onedark/palette.lua (warmer).
# Glassy: base surfaces transparent (bg=default) so kitty's
# background_blur shows through; only active accent pills opaque.
# ──────────────────────────────────────────────────────────────

# ── Status bar ──────────────────────────────────────────────
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#a7aab0"

# ── Left: session name, with a prefix-active indicator ──────
set -g status-left-length 60
set -g status-left "#[fg=#232326,bg=#57a5e5,bold] #S #[fg=#57a5e5,bg=default]#{?client_prefix,#[fg=#51a8b3] ● ,} "

# ── Windows: subtle when inactive, accented when focused ────
set -g window-status-separator ""
set -g window-status-format "#[fg=#5a5b5e,bg=default]  #I:#W  "
set -g window-status-current-format "#[fg=#232326,bg=#57a5e5,bold]  #I:#W#{?window_zoomed_flag, 󰁌 ,}  "

# ── Right: current path + clock ─────────────────────────────
set -g status-right-length 120
set -g status-right "#[fg=#5a5b5e,bg=default] ? help #[fg=#a7aab0] #{b:pane_current_path} #[fg=#232326,bg=#bb70d2] 󰥔 %H:%M #(sh ~/.config/tmux/notify-omp-waiting.sh)"

# ── Panes ───────────────────────────────────────────────────
set -g pane-border-style "fg=#37383d"
set -g pane-active-border-style "fg=#57a5e5"

# ── Messages / copy-mode ────────────────────────────────────
# `fill` is REQUIRED on tmux 3.7+ (issue #4861): without it the command
# prompt overlays the status content instead of replacing it.
set -g message-style "bg=#35363b,fg=#a7aab0,fill=#35363b"
set -g message-command-style "bg=#35363b,fg=#57a5e5,fill=#35363b"
set -g mode-style "bg=#57a5e5,fg=#232326"

# ── Clock ───────────────────────────────────────────────────
setw -g clock-mode-colour "#57a5e5"

# ──────────────────────────────────────────────────────────────
# Vesper — hand-authored static palette for tmux.
# Sourced last by tmux.conf, overrides all prior styling.
# Matches kitty/current-theme.conf.
# Palette: raunofreiberg/vesper (bg #101010, text 19.0:1).
# Accent pills use Vesper peach #ffc799 (12.6:1). Mode/state colours are
# the three canonical Vesper accents, which sit >=10 CIEDE2000 apart under
# simulated colour deficiency and also form a lightness ladder.
# Glassy: base surfaces transparent (bg=default) so kitty's
# background_blur shows through; only active accent pills opaque.
# ──────────────────────────────────────────────────────────────

# ── Status bar ──────────────────────────────────────────────
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#ffffff"

# ── Left: session name, with a prefix-active indicator ──────
set -g status-left-length 60
set -g status-left "#[fg=#101010,bg=#ffc799,bold] #S #[fg=#ffc799,bg=default]#{?client_prefix,#[fg=#99ffe4] ● ,} "

# ── Windows: subtle when inactive, accented when focused ────
set -g window-status-separator ""
set -g window-status-format "#[fg=#707070,bg=default]  #I:#W  "
set -g window-status-current-format "#[fg=#101010,bg=#ffc799,bold]  #I:#W#{?window_zoomed_flag, 󰁌 ,}  "

# ── Right: current path + clock ─────────────────────────────
set -g status-right-length 120
set -g status-right "#[fg=#707070,bg=default] ? help #[fg=#ffffff] #{b:pane_current_path} #[fg=#101010,bg=#99ffe4] 󰥔 %H:%M #(sh ~/.config/tmux/notify-omp-waiting.sh)"

# ── Panes ───────────────────────────────────────────────────
set -g pane-border-style "fg=#505050"
set -g pane-active-border-style "fg=#ffc799"

# ── Messages / copy-mode ────────────────────────────────────
# `fill` is REQUIRED on tmux 3.7+ (issue #4861): without it the command
# prompt overlays the status content instead of replacing it.
set -g message-style "bg=#343434,fg=#ffffff,fill=#343434"
set -g message-command-style "bg=#343434,fg=#ffc799,fill=#343434"
set -g mode-style "bg=#343434,fg=#ffffff"

# ── Clock ───────────────────────────────────────────────────
setw -g clock-mode-colour "#ffc799"

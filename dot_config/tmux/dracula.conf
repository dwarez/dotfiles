# ──────────────────────────────────────────────────────────────
# Dracula — hand-authored static palette for tmux.
# Sourced last by tmux.conf, overrides all prior styling.
# Matches kitty/current-theme.conf (official dracula/kitty values).
#
# Mode/state colours deliberately avoid GREEN. Green is the only colour in
# Dracula that collapses under simulated colour deficiency — against orange
# (3.2), yellow (3.6) and cyan (7.3) — so state is carried by
# cyan / yellow / red, which sit 29.0 / 40.9 / 20.9 CIEDE2000 apart.
#
# Glassy: base surfaces transparent (bg=default) so kitty's
# background_blur shows through; only active accent pills opaque.
# ──────────────────────────────────────────────────────────────

# ── Status bar ──────────────────────────────────────────────
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#f8f8f2"

# ── Left: session name, with a prefix-active indicator ──────
set -g status-left-length 60
set -g status-left "#[fg=#282a36,bg=#bd93f9,bold] #S #[fg=#bd93f9,bg=default]#{?client_prefix,#[fg=#8be9fd] ● ,} "

# ── Windows: subtle when inactive, accented when focused ────
set -g window-status-separator ""
set -g window-status-format "#[fg=#6272a4,bg=default]  #I:#W  "
set -g window-status-current-format "#[fg=#282a36,bg=#bd93f9,bold]  #I:#W#{?window_zoomed_flag, 󰁌 ,}  "

# ── Right: current path + clock ─────────────────────────────
set -g status-right-length 120
set -g status-right "#[fg=#6272a4,bg=default] ? help #[fg=#f8f8f2] #{b:pane_current_path} #[fg=#282a36,bg=#8be9fd] 󰥔 %H:%M #(sh ~/.config/tmux/notify-omp-waiting.sh)"

# ── Panes ───────────────────────────────────────────────────
set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=#bd93f9"

# ── Messages / copy-mode ────────────────────────────────────
# `fill` is REQUIRED on tmux 3.7+ (issue #4861): without it the command
# prompt overlays the status content instead of replacing it.
set -g message-style "bg=#44475a,fg=#f8f8f2,fill=#44475a"
set -g message-command-style "bg=#44475a,fg=#8be9fd,fill=#44475a"
set -g mode-style "bg=#44475a,fg=#f8f8f2"

# ── Clock ───────────────────────────────────────────────────
setw -g clock-mode-colour "#bd93f9"

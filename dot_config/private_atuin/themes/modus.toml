# Modus vivendi (deuteranopia) theme for atuin.
# Keys are the full color set atuin 18.19.0 accepts (crates/atuin-client/src/theme.rs).
# Note: there is no "Highlight" key in this version — including one makes the
# whole theme fail to deserialize and atuin silently renders unstyled.
# AlertInfo/Warn/Error form a lightness ladder (L*77 / L*92 / L*62) so severity
# reads without relying on hue.

[theme]
name = "modus"

[colors]
Base = "#ffffff"            # fg — default foreground
Title = "#efef00"           # warning yellow, highest contrast (15.2:1)
Important = "#ffa00f"       # orange
Guidance = "#79a8ff"        # blue
Annotation = "#989898"      # neutral grey
Muted = "#7a7a7a"            # dim grey
AlertInfo = "#00d3d0"        # cyan   L*77
AlertWarn = "#efef00"        # yellow L*92
AlertError = "#ff5f59"       # red    L*62
SyntaxCommand = "#ffa00f"   # orange — function
SyntaxFlag = "#efef00"      # yellow — keyword
SyntaxString = "#00d3d0"    # cyan — string
SyntaxVariable = "#c4d5ff"  # pale blue — identifier
SyntaxOperator = "#ffffff"  # white — operator
SyntaxComment = "#989898"   # grey — comment

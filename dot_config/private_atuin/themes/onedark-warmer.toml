# One Dark (warmer) theme for atuin. Palette: navarasu/onedark.nvim warmer.
# Keys are the full color set atuin 18.19.0 accepts (crates/atuin-client/src/theme.rs).
# Note: there is no "Highlight" key in this version — including one makes the
# whole theme fail to deserialize and atuin silently renders unstyled.

[theme]
name = "onedark-warmer"

[colors]
Base = "#a7aab0"            # fg — default foreground
Title = "#57a5e5"           # blue
Important = "#dbb671"       # yellow
Guidance = "#bb70d2"        # purple
Annotation = "#818387"      # light_grey
Muted = "#5a5b5e"            # grey
AlertInfo = "#8fb573"        # green
AlertWarn = "#c49060"        # orange
AlertError = "#e86671"       # dark-variant red
SyntaxCommand = "#57a5e5"   # blue — function
SyntaxFlag = "#bb70d2"      # purple — keyword
SyntaxString = "#8fb573"    # green — string
SyntaxVariable = "#dbb671"  # yellow — identifier
SyntaxOperator = "#de5d68"  # red — operator
SyntaxComment = "#5a5b5e"   # grey — comment

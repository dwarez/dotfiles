# Vesper theme for atuin. Palette: raunofreiberg/vesper.
# Keys are the full color set atuin 18.19.0 accepts (crates/atuin-client/src/theme.rs).
# Note: there is no "Highlight" key in this version — including one makes the
# whole theme fail to deserialize and atuin silently renders unstyled.
# AlertInfo/Warn/Error are the three canonical Vesper accents: >=10 CIEDE2000
# apart under simulated colour deficiency, and a lightness ladder (93/84/68).

[theme]
name = "vesper"

[colors]
Base = "#ffffff"            # fg
Title = "#ffc799"           # peach (12.6:1)
Important = "#ffc799"       # peach
Guidance = "#66cbb2"        # mint mid
Annotation = "#a0a0a0"      # grey
Muted = "#707070"            # dim grey
AlertInfo = "#99ffe4"        # mint  L*93
AlertWarn = "#ffc799"        # peach L*84
AlertError = "#ff8080"       # red   L*68
SyntaxCommand = "#ffc799"   # peach — function
SyntaxFlag = "#99ffe4"      # mint — keyword
SyntaxString = "#66cbb2"    # mint mid — string
SyntaxVariable = "#ffffff"  # white — identifier
SyntaxOperator = "#a0a0a0"  # grey — operator
SyntaxComment = "#707070"   # dim grey — comment

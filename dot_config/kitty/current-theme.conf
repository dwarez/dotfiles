# vim:ft=kitty

## name: Vesper
## license: MIT
## author: Rauno Freiberg (palette), nvim port: datsfilipe/vesper.nvim
## upstream: https://github.com/raunofreiberg/vesper
## blurb: Minimal near-black theme. Chosen for colour-deficiency readability:
## text 19.0:1, and only THREE canonical accents (red #ff8080, peach #ffc799,
## mint #99ffe4) so there is little to confuse. Upstream leaves blue/magenta
## undefined and duplicates green into cyan; those three slots are filled here
## with pure LIGHTNESS variants of Vesper's own hues, which lifts worst-case
## pairwise separation under simulated deuteranomaly from 0.0 to 10.0 CIEDE2000.

#: The basic colors

foreground                      #ffffff
background                      #101010
selection_foreground            #ffffff
selection_background            #343434

#: Cursor colors

cursor                          #ffc799
cursor_text_color               #101010

#: URL underline color when overing with mouse

url_color                       #66cbb2

#: Tab bar colors

active_tab_foreground           #101010
active_tab_background           #ffc799
inactive_tab_foreground         #a0a0a0
inactive_tab_background         #161616

#: The basic 16 colors

#: black
color0  #343434
color8  #707070

#: red
color1  #ff8080
color9  #ff9c9c

#: green
color2  #99ffe4
color10 #c2ffef

#: yellow
color3  #ffc799
color11 #ffdabc

#: blue
color4  #74828d
color12 #939ea6

#: magenta
color5  #a8774d
color13 #bb9574

#: cyan
color6  #66cbb2
color14 #9addcc

#: white
color7  #a0a0a0
color15 #ffffff


#: You can set the remaining 240 colors as color16 to color255.

color16 #ff7300
color17 #ffcfa8

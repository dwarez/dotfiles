# vim:ft=kitty

## name: Dracula
## license: MIT
## author: Zeno Rocha / Dracula Theme
## upstream: https://github.com/dracula/kitty
## blurb: Official Dracula, verbatim. Chosen by measurement: of every palette
## considered it has the highest chroma (mean C* 54.8 across the syntax accents,
## +64% over the previous theme) on a mid-dark #282a36 background, which is what
## makes roles readable at a glance. Only 3 of its 21 accent pairs are
## confusable under simulated colour deficiency and all three involve GREEN, so
## green is kept out of any role that sits beside orange, yellow or cyan.

#: The basic colors

foreground                      #f8f8f2
background                      #282a36
selection_foreground            #ffffff
selection_background            #44475a

#: Cursor colors

cursor                          #f8f8f2
cursor_text_color               #282a36

#: URL underline color when overing with mouse

url_color                       #8be9fd

#: Tab bar colors

active_tab_foreground           #282a36
active_tab_background           #f8f8f2
inactive_tab_foreground         #282a36
inactive_tab_background         #6272a4

#: The basic 16 colors


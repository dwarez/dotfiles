# vim:ft=kitty

## name: Modus_vivendi_deuteranopia
## license: GPL-3.0
## author: Protesilaos Stavrou (palette), port: miikanissi/modus-themes.nvim
## upstream: https://github.com/miikanissi/modus-themes.nvim
## blurb: Accessibility-first dark theme. Background lowered to #121212 (fg 18.7:1).
## Status colours form a deliberate lightness ladder (error L*62 / success L*77 /
## warning L*92) so they stay separable under red-green colour deficiency AND
## under total hue loss. Diff uses a blue-vs-yellow axis, never red-vs-green.

#: The basic colors

foreground                      #ffffff
background                      #121212
selection_foreground            #ffffff
selection_background            #3a3a4a

#: Cursor colors

cursor                          #efef00

#: URL underline color when overing with mouse

url_color                       #79a8ff

#: Tab bar colors

active_tab_foreground           #121212
active_tab_background           #efef00
inactive_tab_foreground         #989898
inactive_tab_background         #1c1c1c

#: The basic 16 colors

#: black
color0  #000000
color8  #595959

#: red
color1  #ff5f59
color9  #ff6b55

#: green
color2  #44bc44
color10 #00c06f

#: yellow
color3  #cabf00
color11 #efef00

#: blue
color4  #2fafff
color12 #79a8ff

#: magenta
color5  #feacd0
color13 #f78fe7

#: cyan
color6  #00d3d0
color14 #6ae4b9

#: white
color7  #a6a6a6
color15 #ffffff


#: You can set the remaining 240 colors as color16 to color255.

color16 #ffa00f
color17 #d4d48f
